<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Tax Test Runner</title></head>
<body>
<h2>고팡 세무 — Tax Test Runner</h2>
<button onclick="runCleanup()" style="padding:10px 20px;margin:5px;background:#ef4444;color:white;border:none;cursor:pointer;font-size:14px">1. Cleanup</button>
<button onclick="runTest()"    style="padding:10px 20px;margin:5px;background:#22c55e;color:white;border:none;cursor:pointer;font-size:14px">2. Run Tax Test</button>
<button onclick="runCheck()"  style="padding:10px 20px;margin:5px;background:#3b82f6;color:white;border:none;cursor:pointer;font-size:14px">3. Check Result</button>
<pre id="log" style="background:#1e1e1e;color:#d4d4d4;padding:20px;height:560px;overflow:auto;margin-top:10px;font-size:13px"></pre>
<script>
// ── 설정 ──────────────────────────────────────────
var proto = 'https';
var host  = 'ebbecjfrwaswbdybbgiu.supabase.co';
var S = proto + '://' + host;
var K = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImViYmVjamZyd2Fzd2JkeWJiZ2l1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NjE5ODQsImV4cCI6MjA5NTEzNzk4NH0.H2ahQKtWdSke04Pdi3hDY86pdTx7UUKPUpQMlS_zciA';
var H  = { 'apikey': K, 'Authorization': 'Bearer ' + K, 'Content-Type': 'application/json' };
var Hd = { 'apikey': K, 'Authorization': 'Bearer ' + K };

var GA = 'aaaaaaaa-test-4000-a000-000000000001'; // 개인 사업자 A (농부)
var GB = 'bbbbbbbb-test-4000-b000-000000000002'; // 개인 사업자 B (디자이너)

// ── 세율 ──────────────────────────────────────────
var VAT_RATE    = 0.10;  // 부가가치세 10%
var IT_RATE     = 0.06;  // 종합소득세 6% (최저세율)
var LOCAL_RATE  = 0.10;  // 지방소득세 = 소득세의 10%
var GDC_FEE     = 0.0020; // 고팡 GDC 수수료 0.20%

function log(msg) {
  var el = document.getElementById('log');
  el.textContent += msg + '\n';
  el.scrollTop = el.scrollHeight;
}

function fmt(n) {
  return (+(n || 0)).toLocaleString('ko-KR', { maximumFractionDigits: 2 });
}

// ── 세금 계산 ─────────────────────────────────────
function calcTax(revenue, opex) {
  var income   = Math.max(0, revenue - opex);
  var vat      = Math.round(revenue * VAT_RATE * 100) / 100;
  var it       = Math.round(income  * IT_RATE  * 100) / 100;
  var localTax = Math.round(it      * LOCAL_RATE* 100) / 100;
  var total    = Math.round((vat + it + localTax) * 100) / 100;
  return { income: income, vat: vat, it: it, localTax: localTax, total: total };
}

// ── Supabase 헬퍼 ─────────────────────────────────
async function getExtra(g) {
  var r = await fetch(S + '/rest/v1/user_profiles?guid=eq.' + g + '&select=extra&limit=1', { headers: Hd });
  var rows = await r.json();
  return (rows[0] && rows[0].extra) || {};
}

async function patchExtra(g, extra) {
  return await fetch(S + '/rest/v1/user_profiles?guid=eq.' + g, {
    method: 'PATCH',
    headers: Object.assign({}, Hd, { 'Content-Type': 'application/json' }),
    body: JSON.stringify({ extra: extra })
  });
}

// ── 1. Cleanup ────────────────────────────────────
async function runCleanup() {
  log('=== CLEANUP START ===');

  // 재무제표 초기화 데이터 (현금 100만, 매출/비용 0)
  var fsReset = {
    bs: { 'bs-cash':'1000000','bs-ar':'0','bs-inventory':'500000',
          'bs-ppe':'0','bs-ap':'0','bs-debt':'0','bs-equity':'1500000' },
    pl: { 'pl-revenue':'0','pl-cogs':'0','pl-opex':'0','pl-other':'0' },
    cf: { 'cf-op':'0','cf-inv':'0','cf-fin':'0' }
  };

  // 원장·PDV·재고 삭제
  var steps = [
    ['fs_ledger', 'guid=eq.' + GA],
    ['fs_ledger', 'guid=eq.' + GB],
    ['fs_ledger', 'counterpart=eq.jeju-tax-authority'],
    ['pdv_log',   'user_guid=eq.' + GA],
    ['pdv_log',   'user_guid=eq.' + GB],
    ['inventory', 'owner_guid=eq.' + GA],
    ['inventory', 'owner_guid=eq.' + GB],
  ];
  for (var i = 0; i < steps.length; i++) {
    var r = await fetch(S + '/rest/v1/' + steps[i][0] + '?' + steps[i][1], { method: 'DELETE', headers: Hd });
    log('DEL [' + steps[i][0] + '] ' + steps[i][1] + ' => ' + r.status);
  }

  // 재무제표 리셋
  for (var gi = 0; gi < [GA, GB].length; gi++) {
    var g  = [GA, GB][gi];
    var ex = await getExtra(g);
    ex.fs  = JSON.parse(JSON.stringify(fsReset));
    var ru = await patchExtra(g, ex);
    log('RESET FS [' + (gi === 0 ? 'A' : 'B') + '] => ' + ru.status);
  }
  log('=== CLEANUP DONE ===');
}

// ── 2. Run Tax Test ───────────────────────────────
async function runTest() {
  log('=== TAX TEST START ===');

  // ─ 재고 등록 (마켓 거래 시뮬용) ─
  log('--- 재고 등록 ---');
  var iA1 = await addItem(GA, 'Jeju Mandarin 10kg',       'farm',    28000, 50,  'box',     'parcel');
  var iA2 = await addItem(GA, 'Jeju Hallabong 5kg',        'farm',    35000, 30,  'box',     'parcel');
  var iA3 = await addItem(GA, 'Smart Farm Consulting 1hr', 'service', 50000, 10,  'session', 'video call');
  var iB1 = await addItem(GB, 'Landing Page Dev',          'digital', 300000, 5,  'project', 'online');
  var iB2 = await addItem(GB, 'Logo Design 3 drafts',      'digital', 150000, 10, 'project', 'file');

  // ─ 사전 재무 상태 확인 ─
  var preA = await getExtra(GA);
  var preB = await getExtra(GB);
  log('PRE A cash=' + preA.fs.bs['bs-cash'] + '  revenue=' + preA.fs.pl['pl-revenue'] + '  opex=' + preA.fs.pl['pl-opex']);
  log('PRE B cash=' + preB.fs.bs['bs-cash'] + '  revenue=' + preB.fs.pl['pl-revenue'] + '  opex=' + preB.fs.pl['pl-opex']);

  // ─ 거래 시뮬레이션 (3건) ─
  log('--- TRADE 1: B buys Mandarin x5 from A ---');
  var t1 = await trade(GB, GA, iA1, 5, 'home');

  log('--- TRADE 2: A buys Landing Page x1 from B ---');
  var t2 = await trade(GA, GB, iB1, 1, 'promo');

  log('--- TRADE 3: B buys Smart Farm Consulting x2 from A ---');
  var t3 = await trade(GB, GA, iA3, 2, 'business');

  // ─ 사후 재무 상태 확인 ─
  var postA = await getExtra(GA);
  var postB = await getExtra(GB);
  var revA  = parseFloat(postA.fs.pl['pl-revenue'] || '0');
  var opexA = parseFloat(postA.fs.pl['pl-opex']    || '0');
  var cashA = parseFloat(postA.fs.bs['bs-cash']    || '0');
  var revB  = parseFloat(postB.fs.pl['pl-revenue'] || '0');
  var opexB = parseFloat(postB.fs.pl['pl-opex']    || '0');
  var cashB = parseFloat(postB.fs.bs['bs-cash']    || '0');

  log('');
  log('=== POST-TRADE FINANCIALS ===');
  log('A cash: ' + preA.fs.bs['bs-cash'] + ' -> ' + cashA);
  log('A revenue=' + revA + '  opex=' + opexA);
  log('B cash: ' + preB.fs.bs['bs-cash'] + ' -> ' + cashB);
  log('B revenue=' + revB + '  opex=' + opexB);

  // ─ 세금 계산 ─
  var taxA = calcTax(revA, opexA);
  var taxB = calcTax(revB, opexB);

  log('');
  log('=== 2Q TAX CALCULATION ===');
  log('--- 납세자 A (농부) ---');
  log('  매출:       ₮' + fmt(revA));
  log('  필요경비:   ₮' + fmt(opexA));
  log('  과세표준:   ₮' + fmt(taxA.income));
  log('  부가세(10%):₮' + fmt(taxA.vat));
  log('  소득세(6%): ₮' + fmt(taxA.it));
  log('  지방세(10%):₮' + fmt(taxA.localTax));
  log('  납부합계:   ₮' + fmt(taxA.total));

  log('--- 납세자 B (디자이너) ---');
  log('  매출:       ₮' + fmt(revB));
  log('  필요경비:   ₮' + fmt(opexB));
  log('  과세표준:   ₮' + fmt(taxB.income));
  log('  부가세(10%):₮' + fmt(taxB.vat));
  log('  소득세(6%): ₮' + fmt(taxB.it));
  log('  지방세(10%):₮' + fmt(taxB.localTax));
  log('  납부합계:   ₮' + fmt(taxB.total));

  // ─ 납부 가능 여부 ─
  log('');
  log('=== 납부 가능 여부 ===');
  log('A 현금 ' + fmt(cashA) + ' >= 세금 ' + fmt(taxA.total) + ' → ' + (cashA >= taxA.total ? '납부 가능' : '잔액 부족'));
  log('B 현금 ' + fmt(cashB) + ' >= 세금 ' + fmt(taxB.total) + ' → ' + (cashB >= taxB.total ? '납부 가능' : '잔액 부족'));

  // ─ OpenHash 납세 원장 기록 ─
  log('');
  log('=== OpenHash 납세 원장 기록 ===');
  var txA = await recordTaxPayment(GA, taxA, revA, opexA);
  var txB = await recordTaxPayment(GB, taxB, revB, opexB);

  // ─ 최종 잔액 확인 ─
  var finalA = await getExtra(GA);
  var finalB = await getExtra(GB);

  log('');
  log('=== FINAL RESULT ===');
  log('A 납세 후 현금: ₮' + fmt(finalA.fs.bs['bs-cash']));
  log('B 납세 후 현금: ₮' + fmt(finalB.fs.bs['bs-cash']));
  log('txA=' + txA);
  log('txB=' + txB);
  log('');
  log('Reload A: ' + proto + '://gopang.net/user_template.html?guid=' + GA + '&session=test-session-token-user-a-2026');
  log('Reload B: ' + proto + '://gopang.net/user_template.html?guid=' + GB + '&session=test-session-token-user-b-2026');
  log('Tax App A: ' + proto + '://tax.gopang.net/webapp.html?guid=' + GA);
  log('Tax App B: ' + proto + '://tax.gopang.net/webapp.html?guid=' + GB);
  log('=== TAX TEST DONE ===');
}

// ─ 재고 추가 ─────────────────────────────────────
async function addItem(owner, name, cat, price, qty, unit, delivery) {
  var r = await fetch(S + '/rest/v1/inventory', {
    method: 'POST',
    headers: Object.assign({}, H, { 'Prefer': 'return=representation' }),
    body: JSON.stringify({ owner_guid: owner, name: name, category: cat,
      unit_price: price, quantity: qty, unit: unit, delivery: delivery, is_public: true })
  });
  var d   = await r.json();
  var row = Array.isArray(d) ? d[0] : d;
  log((r.ok ? 'OK' : 'ERR') + ' ' + name + ' id=' + (row && row.id));
  return row;
}

// ─ 거래 실행 (market 동일 7단계) ─────────────────
async function trade(buyer, seller, item, qty, why) {
  var total = qty * item.unit_price;
  var fee   = Math.round(total * GDC_FEE * 10000) / 10000;
  var net   = total - fee;
  var tx    = crypto.randomUUID();
  var now   = new Date().toISOString();
  log('TRADE ' + item.name + ' x' + qty + ' total=' + total + ' fee=' + fee + ' net=' + net);

  var r1 = await fetch(S + '/rest/v1/inventory?id=eq.' + item.id, { method: 'PATCH', headers: H, body: JSON.stringify({ quantity: item.quantity - qty }) });
  log('[1] inv ' + r1.status);

  var r2 = await fetch(S + '/rest/v1/pdv_log', { method: 'POST', headers: Object.assign({}, H, { 'Prefer': 'return=representation' }),
    body: JSON.stringify({ user_guid: buyer, service_id: 'gopang-market', record_type: 'purchase',
      summary: item.name + ' x' + qty + ' buy', what: item.name, how: item.delivery || 'direct',
      why: why || 'buy', category: 'market',
      extra: { tx_id: tx, item_id: item.id, qty: qty, unit_price: item.unit_price, total: total, seller_guid: seller, currency: 'GDC' } })
  });
  var pd  = await r2.json();
  var pid = (Array.isArray(pd) ? pd[0] : pd)?.id || null;
  log('[2] buyer PDV ' + r2.status + ' id=' + pid);

  var r3 = await fetch(S + '/rest/v1/pdv_log', { method: 'POST', headers: Object.assign({}, H, { 'Prefer': 'return=minimal' }),
    body: JSON.stringify({ user_guid: seller, service_id: 'gopang-market', record_type: 'sale',
      summary: item.name + ' x' + qty + ' sell', what: item.name, how: item.delivery || 'direct',
      why: 'sale', category: 'market',
      extra: { tx_id: tx, item_id: item.id, qty: qty, unit_price: item.unit_price, total: total, fee: fee, seller_net: net, buyer_guid: buyer, currency: 'GDC' } })
  });
  log('[3] seller PDV ' + r3.status);

  var r4 = await fetch(S + '/rest/v1/fs_ledger', { method: 'POST', headers: Object.assign({}, H, { 'Prefer': 'return=minimal' }),
    body: JSON.stringify({ tx_id: tx, guid: buyer, counterpart: seller, direction: 'debit',
      amount: total, item_name: item.name, item_id: item.id, quantity: qty,
      pdv_log_id: pid, fs_account: 'cash', memo: item.name + ' buy', tx_at: now })
  });
  log('[4] buyer ledger ' + r4.status);

  var r5 = await fetch(S + '/rest/v1/fs_ledger', { method: 'POST', headers: Object.assign({}, H, { 'Prefer': 'return=minimal' }),
    body: JSON.stringify({ tx_id: tx, guid: seller, counterpart: buyer, direction: 'credit',
      amount: net, item_name: item.name, item_id: item.id, quantity: qty,
      pdv_log_id: null, fs_account: 'revenue', memo: item.name + ' sell', tx_at: now })
  });
  log('[5] seller ledger ' + r5.status);

  var r6 = await fetch(S + '/rest/v1/fs_ledger', { method: 'POST', headers: Object.assign({}, H, { 'Prefer': 'return=minimal' }),
    body: JSON.stringify({ tx_id: tx, guid: seller, counterpart: 'gopang-platform', direction: 'debit',
      amount: fee, item_name: 'GDC fee', item_id: null, quantity: 1,
      pdv_log_id: null, fs_account: 'platform_fee', memo: 'fee tx:' + tx.slice(0, 8), tx_at: now })
  });
  log('[6] fee ledger ' + r6.status);

  await updateFS(buyer,  { 'bs-cash': -total });
  await updateFS(seller, { 'bs-cash': net, 'pl-revenue': total, 'pl-opex': fee });
  log('[7] FS done');
  return { tx: tx, total: total, fee: fee, net: net };
}

// ─ FS 업데이트 ────────────────────────────────────
async function updateFS(g, d) {
  var ex = await getExtra(g);
  ex.fs = ex.fs || {}; ex.fs.bs = ex.fs.bs || {}; ex.fs.pl = ex.fs.pl || {};
  Object.keys(d).forEach(function(k) {
    var sc = k.indexOf('bs-') === 0 ? 'bs' : 'pl';
    ex.fs[sc][k] = String(Math.max(0, (parseFloat(ex.fs[sc][k] || '0') || 0) + d[k]));
  });
  await patchExtra(g, ex);
}

// ─ 납세 원장 기록 (OpenHash fs_ledger + PDV) ──────
async function recordTaxPayment(g, tax, revenue, opex) {
  if (tax.total === 0) { log('[TAX] ' + g.slice(0, 8) + '… 세금 없음 — 기록 건너뜀'); return null; }

  var txId = crypto.randomUUID();
  var now  = new Date().toISOString();
  var who  = g === GA ? 'A' : 'B';

  // fs_ledger — 납세자 차변 (현금 감소)
  var r1 = await fetch(S + '/rest/v1/fs_ledger', { method: 'POST', headers: Object.assign({}, H, { 'Prefer': 'return=minimal' }),
    body: JSON.stringify({
      tx_id: txId, guid: g, counterpart: 'jeju-tax-authority',
      direction: 'debit', amount: tax.total,
      item_name: '2026 Q2 세금 납부', item_id: null, quantity: 1,
      pdv_log_id: null, fs_account: 'tax_payment',
      memo: 'VAT:' + tax.vat + ' IT:' + tax.it + ' Local:' + tax.localTax,
      tx_at: now
    })
  });
  log('[TAX-' + who + '] ledger debit ₮' + fmt(tax.total) + ' => ' + r1.status);

  // fs_ledger — 국세청 대변 (세수 증가)
  var r2 = await fetch(S + '/rest/v1/fs_ledger', { method: 'POST', headers: Object.assign({}, H, { 'Prefer': 'return=minimal' }),
    body: JSON.stringify({
      tx_id: txId, guid: 'jeju-tax-authority', counterpart: g,
      direction: 'credit', amount: tax.total,
      item_name: '2026 Q2 세수', item_id: null, quantity: 1,
      pdv_log_id: null, fs_account: 'tax_revenue',
      memo: '제주지방국세청 세수 tx:' + txId.slice(0, 8),
      tx_at: now
    })
  });
  log('[TAX-' + who + '] authority credit => ' + r2.status);

  // PDV 납세 기록
  var r3 = await fetch(S + '/rest/v1/pdv_log', { method: 'POST', headers: Object.assign({}, H, { 'Prefer': 'return=minimal' }),
    body: JSON.stringify({
      user_guid: g, service_id: 'gopang-tax', record_type: 'tax',
      summary: '2026 Q2 납세 완료 ₮' + fmt(tax.total),
      what: '종합소득세+부가가치세+지방소득세', how: 'GDC auto-transfer',
      why: '분기 납세', category: 'tax',
      extra: {
        tx_id: txId, quarter: '2026-Q2',
        revenue: revenue, opex: opex, income: tax.income,
        vat: tax.vat, income_tax: tax.it, local_tax: tax.localTax,
        total: tax.total, currency: 'GDC',
        authority: '제주지방국세청'
      }
    })
  });
  log('[TAX-' + who + '] PDV tax record => ' + r3.status);

  // 납세 후 현금 차감
  await updateFS(g, { 'bs-cash': -tax.total });
  log('[TAX-' + who + '] cash -₮' + fmt(tax.total) + ' done');

  return txId;
}

// ── 3. Check Result ───────────────────────────────
async function runCheck() {
  log('=== CHECK ===');

  // 재무제표
  for (var gi = 0; gi < [GA, GB].length; gi++) {
    var g   = [GA, GB][gi];
    var who = gi === 0 ? 'A' : 'B';
    var ex  = await getExtra(g);
    var bs  = (ex.fs && ex.fs.bs) || {};
    var pl  = (ex.fs && ex.fs.pl) || {};
    var rev  = parseFloat(pl['pl-revenue'] || '0');
    var opex = parseFloat(pl['pl-opex']    || '0');
    var tax  = calcTax(rev, opex);
    log('[' + who + '] cash=' + fmt(bs['bs-cash']) +
        '  rev=' + fmt(rev) + '  opex=' + fmt(opex) +
        '  TAX=' + fmt(tax.total) + ' (VAT:' + fmt(tax.vat) + ' IT:' + fmt(tax.it) + ' Local:' + fmt(tax.localTax) + ')');
  }

  // 납세 원장 조회
  log('--- 납세 원장 (jeju-tax-authority) ---');
  var r = await fetch(S + '/rest/v1/fs_ledger?guid=eq.jeju-tax-authority&select=tx_id,counterpart,amount,memo,tx_at&order=tx_at.desc&limit=10', { headers: Hd });
  var rows = await r.json();
  log('국세청 세수 건수: ' + (Array.isArray(rows) ? rows.length : 0) + '건');
  if (Array.isArray(rows)) {
    rows.forEach(function(x) {
      log('  TX ' + x.tx_id.slice(0, 8) + '…  counterpart=' + x.counterpart.slice(0, 8) +
          '…  ₮' + fmt(x.amount) + '  ' + (x.memo || ''));
    });
  }

  // PDV 납세 내역
  log('--- PDV 납세 기록 ---');
  var r2 = await fetch(S + '/rest/v1/pdv_log?service_id=eq.gopang-tax&order=id.desc&limit=10&select=user_guid,summary,extra', { headers: Hd });
  var pdvRows = await r2.json();
  log('납세 PDV 건수: ' + (Array.isArray(pdvRows) ? pdvRows.length : 0) + '건');
  if (Array.isArray(pdvRows)) {
    pdvRows.forEach(function(x) {
      log('  ' + x.user_guid.slice(0, 8) + '… | ' + x.summary);
    });
  }

  // 재고 현황
  log('--- 재고 현황 ---');
  var r3 = await fetch(S + '/rest/v1/inventory?owner_guid=in.(' + GA + ',' + GB + ')&select=owner_guid,name,quantity', { headers: Hd });
  var inv = await r3.json();
  log('재고 건수: ' + (Array.isArray(inv) ? inv.length : 0));
  if (Array.isArray(inv)) {
    inv.forEach(function(x) {
      log('  ' + (x.owner_guid === GA ? 'A' : 'B') + ' | ' + x.name + ' | qty=' + x.quantity);
    });
  }

  log('=== CHECK DONE ===');
}
</script>
</body>
